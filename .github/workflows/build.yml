name: build

on:
  push:
    branches: [ main ]
    tags:    [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + build + test + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # review+修复 campaign 后全部转为**硬门禁**(去掉 continue-on-error):本地每轮必过,
      # CI 也强制,防 78 项测试 / fmt / clippy 回归。(ledger CI-1/CI-2/CI-3/CI-4)
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo build (all targets)
        run: cargo build --workspace --all-targets --locked
      - name: cargo test (all targets)
        run: cargo test --workspace --all-targets --locked
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit（依赖已知漏洞扫描）
        run: cargo audit

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build release
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: package
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/bftool.exe" "$dist/bftool.exe"
          Copy-Item "target/${{ matrix.target }}/release/bftool-gui.exe" "$dist/bftool-gui.exe"
          Copy-Item "bftool.toml.example" "$dist/bftool.toml.example"
          Copy-Item "README.md" "$dist/README.md"
          Copy-Item "LICENSE" "$dist/LICENSE"
          Compress-Archive -Path "$dist/*" -DestinationPath "bftool-${{ matrix.target }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: bftool-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bftool.exe
            target/${{ matrix.target }}/release/bftool-gui.exe
            bftool-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: release
    needs: [build, audit]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/bftool-*.zip
            artifacts/**/bftool.exe
            artifacts/**/bftool-gui.exe
          generate_release_notes: true
