name: build

on:
  push:
    branches: [ main ]
    tags:    [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + build + test + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # review+修复 campaign 后全部转为**硬门禁**(去掉 continue-on-error):本地每轮必过,
      # CI 也强制,防全部测试 / fmt / clippy 回归。(ledger CI-1/CI-2/CI-3/CI-4)
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo build (all targets)
        run: cargo build --workspace --all-targets --locked
      - name: cargo test (audited Windows suite; 33 safety exclusions)
        # Do not scan physical volumes or require symlink privileges in this suite.
        # Exclusions are explicit; this is not a full-suite acceptance claim.
        run: python scripts/test_safe_windows.py
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit（依赖已知漏洞扫描）
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file crates/bftool-desktop-bridge/Cargo.lock
          cargo audit --file apps/desktop/src-tauri/Cargo.lock

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build release
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: package
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/bftool.exe" "$dist/bftool.exe"
          Copy-Item "target/${{ matrix.target }}/release/bftool-gui.exe" "$dist/bftool-gui.exe"
          Copy-Item "bftool.toml.example" "$dist/bftool.toml.example"
          Copy-Item "README.md" "$dist/README.md"
          Copy-Item "other.md" "$dist/other.md"
          Copy-Item "LICENSE" "$dist/LICENSE"
          New-Item -ItemType Directory -Force -Path "$dist/docs" | Out-Null
          Copy-Item "docs/REPAIR_ACCEPTANCE.md" "$dist/docs/REPAIR_ACCEPTANCE.md"
          New-Item -ItemType Directory -Force -Path "$dist/vendor/zbus_xml" | Out-Null
          Copy-Item "vendor/zbus_xml/PATCH.md" "$dist/vendor/zbus_xml/PATCH.md"
          Copy-Item "vendor/zbus_xml/LICENSE" "$dist/vendor/zbus_xml/LICENSE"
          Compress-Archive -Path "$dist/*" -DestinationPath "bftool-${{ matrix.target }}.zip" -Force
      - uses: actions/upload-artifact@v6
        with:
          name: bftool-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bftool.exe
            target/${{ matrix.target }}/release/bftool-gui.exe
            bftool-${{ matrix.target }}.zip
          if-no-files-found: error

  desktop:
    name: desktop frontend + bridge + x64 Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/bftool-desktop-bridge -> target
            apps/desktop/src-tauri -> target
      - name: Install locked frontend dependencies
        run: npm ci --prefix apps/desktop --ignore-scripts
      - name: Frontend tests and build
        run: |
          npm test --prefix apps/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix apps/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independent Rust format checks
        run: |
          cargo fmt --manifest-path crates/bftool-desktop-bridge/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bridge synthetic contract and recovery tests
        run: cargo test --manifest-path crates/bftool-desktop-bridge/Cargo.toml --locked
      - name: Bridge lint
        run: cargo clippy --manifest-path crates/bftool-desktop-bridge/Cargo.toml --all-targets --locked -- -D warnings
      - name: Native Release lint
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --release --locked --target x86_64-pc-windows-msvc --features custom-protocol -- -D warnings
      - name: Native x64 Release build
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --release --locked --target x86_64-pc-windows-msvc --features custom-protocol
      - name: Package with reviewed third-party notices
        run: |
          node scripts/package-desktop-release.mjs apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bftool-desktop.exe dist/desktop-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/desktop-x64/* -DestinationPath bftool-desktop-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: bftool-desktop-x64-candidate
          path: bftool-desktop-x64.zip
          if-no-files-found: error

  release:
    name: release
    needs: [build, audit]
    runs-on: ubuntu-latest
    # Candidate tags are published explicitly as prereleases with a GUI-only package.
    # Keep automatic stable releases for plain version tags.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: bftool-x86_64-pc-windows-msvc
          path: artifacts/legacy
      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/bftool-*.zip
            artifacts/**/bftool.exe
            artifacts/**/bftool-gui.exe
          generate_release_notes: true
