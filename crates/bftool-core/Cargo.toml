[package]
name        = "bftool-core"
description = "归档备份工具核心引擎：稳定性检测、SHA256 三重校验、事务式提交、盘检测/初始化、复查、查询"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lib]
name = "bftool_core"
path = "src/lib.rs"

[dependencies]
# Batch 1b 之后 core 不再依赖 indicatif（进度条由 reporter trait 抽象，
# CLI 端用 indicatif 实现，未来 GUI 端可换成自己的进度模型）。
anyhow.workspace  = true
sha2.workspace    = true
walkdir.workspace = true
serde.workspace   = true
serde_json.workspace = true
csv.workspace     = true
chrono.workspace  = true
toml.workspace    = true
sysinfo.workspace = true

[dev-dependencies]
# fs 相关回归测试用临时目录(review+修复 campaign 引入)
tempfile = "3"
