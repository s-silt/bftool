[workspace]
resolver = "2"
members = [
    "crates/bftool-core",
    "crates/bftool-cli",
    "crates/bftool-gui",
    "vendor/zbus_xml",
]
# `cargo build / run` 默认只构建 CLI binary（包含 core 作为依赖）。
# GUI 不进默认 build，避免纯 CLI 用户被迫编 eframe（拉 winit/wgpu 等大依赖）。
# 显式跑全 workspace 用 `--workspace`；单独构建 GUI 用 `-p bftool-gui`。
default-members = ["crates/bftool-cli"]

# 共享的发布元数据 + 依赖版本。子 crate 用 `.workspace = true` 引用，
# 保证升级集中在一处，子 crate 之间不会版本漂移。
[workspace.package]
version = "0.1.11-rc.2"
edition = "2021"
# Locked CLI/core dependencies require Rust 1.85 (including edition-2024 crates).
# GUI declares its higher dependency floor separately. Windows validation used Rust 1.95.0;
# the exact minimum toolchain is not independently certified by that validation.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/s-silt/bftool"
authors = ["s-silt"]

[workspace.dependencies]
clap      = { version = "4.5", features = ["derive", "wrap_help"] }
anyhow    = "1.0"
sha2      = "0.10"
walkdir   = "2.5"
indicatif = "0.17"
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv       = "1.3"
chrono    = { version = "0.4", default-features = false, features = ["clock", "serde"] }
toml      = "0.8"
sysinfo   = { version = "0.32", default-features = false, features = ["disk"] }
eframe    = "0.31"

# zbus_xml 4.x has no upstream release using quick-xml >= 0.41.
# Keep the accessibility API while replacing the vulnerable XML parser.
[patch.crates-io]
zbus_xml = { path = "vendor/zbus_xml" }

# 整个 workspace 的 release 配置在此统一，子 crate 不再重复声明。
[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
# panic = "unwind"(非 abort):GUI 用后台线程跑备份/复查,worker 线程 panic 需能被
# BackgroundTask::take_outcome 的 join()->Err 捕获、降级为 TaskOutcome::Failed 让界面存活
# (见 task.rs 与测试 task_panic_maps_to_failed)。panic="abort" 会让单个任务 panic 直接杀掉
# 整个 GUI 进程,使该恢复逻辑在 release 成为死代码、且界面失去韧性。(review-r2 R5-8)
panic         = "unwind"
