[workspace]
resolver = "2"
members = [
    "crates/bftool-core",
    "crates/bftool-cli",
    "crates/bftool-gui",
]
# `cargo build / run` 默认只构建 CLI binary（包含 core 作为依赖）。
# GUI 不进默认 build，避免纯 CLI 用户被迫编 eframe（拉 winit/wgpu 等大依赖）。
# 显式跑全 workspace 用 `--workspace`；单独构建 GUI 用 `-p bftool-gui`。
default-members = ["crates/bftool-cli"]

# 共享的发布元数据 + 依赖版本。子 crate 用 `.workspace = true` 引用，
# 保证升级集中在一处，子 crate 之间不会版本漂移。
[workspace.package]
version = "0.1.6"
edition = "2021"
# MSRV 1.74：已审计代码所用 std API 均在 1.74 及以前稳定
# (如 let-else 1.65、inline format args 1.58、Option::is_some_and 1.70)。
# 提升 MSRV 前请确认未引入 1.74 之后才稳定的 API。(SEC-010)
rust-version = "1.74"
license = "MIT"
repository = "https://github.com/s-silt/bftool"
authors = ["s-silt"]

[workspace.dependencies]
clap      = { version = "4.5", features = ["derive", "wrap_help"] }
anyhow    = "1.0"
sha2      = "0.10"
walkdir   = "2.5"
indicatif = "0.17"
serde     = { version = "1.0", features = ["derive"] }
csv       = "1.3"
chrono    = { version = "0.4", default-features = false, features = ["clock", "serde"] }
toml      = "0.8"
sysinfo   = { version = "0.32", default-features = false, features = ["disk"] }
eframe    = "0.31"

# 整个 workspace 的 release 配置在此统一，子 crate 不再重复声明。
[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
panic         = "abort"
