[package]
name = "bftool"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "归档备份工具：以文件夹为单位把 SSD 项目安全归档到机械盘，SHA256 三重校验、断点续传、自动编号、绝不误删"
license = "MIT"
repository = "https://github.com/s-silt/bftool"
readme = "README.md"
keywords = ["backup", "archive", "sha256", "windows", "robocopy"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "bftool"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
anyhow = "1.0"
sha2 = "0.10"
walkdir = "2.5"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
toml = "0.8"
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
